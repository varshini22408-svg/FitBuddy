<!DOCTYPE html>
<html>
<head>
    <title>FitBuddy - Your Fitness Plan</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <h1>Your 7-Day Fitness Plan</h1>

    <h2>Workout Plan</h2>
    <pre>{{ workout_plan }}</pre>

    <h2>Nutrition & Recovery Tips</h2>
    <p>{{ nutrition_tip }}</p>

<form action="/submit-feedback" method="post">

    <button type="submit">Update Plan</button>
</form>

    <a href="/">Generate Another Plan</a>

</body>
</html>
